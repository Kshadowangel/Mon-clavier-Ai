name: Compiler MonClavierIA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verifier Gradle
        run: gradle --version

      - name: Compiler APK
        run: gradle assembleDebug --no-daemon

      - name: Verifier la presence de l APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: MonClavierIA
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
